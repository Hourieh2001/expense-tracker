<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">Expense Tracker</a>
         <button id="darkModeToggle" class="btn btn-outline-light">🌙</button>
      </div>
    </nav>
  </header>
  <main>
    <div class="container my-4">
      <!-- Summary Cards -->
      <div class="summary-grid mb-4">
        <div>
          <div class="card text-center summary-card">
            <div class="card-body">
              <p class="text-muted mb-1">Total</p>
              <h3 id="totalAmount">0.00</h3>
            </div>
          </div>
        </div>

        <div>
          <div class="card text-center summary-card">
            <div class="card-body">
              <p class="text-muted mb-1">Number of expenses</p>
              <h3 id="expenseCount">0</h3>
            </div>
          </div>
        </div>

        <div>
          <div class="card text-center summary-card">
            <div class="card-body">
              <p class="text-muted mb-1">Highest expense</p>
              <h3 id="highestAmount">0.00</h3>
              <small id="highestTitle" class="text-muted"></small>
            </div>
          </div>
        </div>

      </div>


      <!-- Add Expense -->
      <div class="card mb-4">
        <div class="card-body">
          <h4 class="mb-3">Add expense</h4>

          <form id="expenseForm">
            <div class="row g-3">

              <div class="col-md-4">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="titleInput" class="form-control" placeholder="Lunch">
              </div>

              <div class="col-md-2">
                <label class="form-label" for="amount">Amount</label>
                <input type="number" id="amountInput" class="form-control" placeholder="4.50" step="any">
              </div>

              <div class="col-md-3">
                <label for="category" class="form-label">Category</label>
                <select id="categoryInput" class="form-select">
                  <option value="">Choose</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="col-md-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" id="dateInput" class="form-control">
              </div>

            </div>

            <button type="submit" class="btn btn-primary mt-3">
              Add Expense
            </button>

          </form>
        </div>
      </div>


      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="text-center my-3" style="display: none;">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>


      <!-- Expenses -->
      <div class="card">
        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Expenses</h4>

            <div class="d-flex align-items-center gap-2 category-filter">
              <label for="filterCategory">Category</label>

              <select id="filterCategory" class="form-select">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>

            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="expensesTable"></tbody>

            </table>
          </div>

        </div>
      </div>

    </div>




    <!-- Edit Expense Modal -->
    <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Edit Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <form id="editExpenseForm">

              <div class="mb-3">
                <label for="editTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="editTitle">
              </div>

              <div class="mb-3">
                <label for="editAmount" class="form-label">Amount</label>
                <input type="number" class="form-control" id="editAmount" step="0.01">
              </div>

              <div class="mb-3">
                <label for="editCategory" class="form-label">Category</label>
                <select class="form-select" id="editCategory">
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="editDate" class="form-label">Date</label>
                <input type="date" class="form-control" id="editDate">
              </div>

            </form>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>

            <button type="submit" form="editExpenseForm" class="btn btn-primary">
              Save Changes
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>
  <footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
